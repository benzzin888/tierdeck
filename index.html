<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10101a"><title>Tierdeck — Мой тир-лист игр</title><meta name="description" content="Соберите свой тир-лист игр. Найдите игру по названию, перетащите обложку на шкалу от 10 до 1 и поделитесь рейтингом."><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="nav wrap"><a class="brand" href="./" aria-label="Tierdeck, редактор"><img src="icon.svg" width="31" height="34" alt="">Tier<span>deck</span></a><nav><button id="editor" class="navbtn active"><i data-i="layout"></i>Редактор</button><button id="lists" class="navbtn"><i data-i="folder"></i>Мои тир-листы</button></nav><span id="status"><i data-i="cloud"></i><span>Сохранено</span></span></div></header>
<main class="wrap"><section class="hero"><div class="heroart" aria-hidden="true">
  <div class="art-panel witcher"><img src="assets/banner/witcher.webp" alt=""></div>
  <div class="art-panel cyberpunk"><img src="assets/banner/cyberpunk.webp" alt=""></div>
  <div class="art-panel outlaw"><img src="assets/banner/red-dead-redemption-2.webp" alt=""></div>
  <div class="art-panel ellie"><img src="assets/banner/ellie-part-ii.webp" alt=""></div>
</div><div class="herotext"><div class="eyeline"><span></span>ИГРОВАЯ КОЛЛЕКЦИЯ</div><div class="titleline"><h1 id="boardname">Мой тир-лист игр</h1><button id="rename" class="edit" aria-label="Изменить название"><i data-i="edit"></i></button></div><p>Расставьте игры по оценкам и поделитесь своим рейтингом.</p><div class="actions"><button class="primary" id="share"><i data-i="share"></i>Поделиться</button><button class="secondary" id="png"><i data-i="download"></i>Скачать PNG</button></div></div></section>
<div class="workspace"><section class="panel ranking"><div class="panelhead"><div class="headrow"><h2><i data-i="layers"></i>Шкала оценок</h2><span class="count" id="rankcount"></span></div><p>Перетащите обложку игры в нужную строку.</p></div><div id="ranks" class="ranks"></div></section>
<aside class="panel library"><div class="panelhead"><div class="headrow"><h2><i data-i="library"></i>Полка игр</h2><span class="count" id="poolcount"></span></div><p>Введите название игры, ссылку Steam или AppID.</p></div><form id="searchform" role="search"><i data-i="search"></i><input id="search" maxlength="500" type="search" autocomplete="off" placeholder="Название игры…" aria-label="Поиск игры" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list"><kbd id="shortcut">/</kbd><div id="results" role="listbox" hidden></div></form><div class="poolwrap" data-zone="0"><div class="poolcap"><span><i data-i="grid"></i>БЕЗ ОЦЕНКИ</span><i data-i="grip"></i></div><div id="pool"></div></div></aside></div></main>
<dialog id="modal"><div class="dialoghead"><h2 id="dialogtitle"></h2><button class="iconbtn" id="close" aria-label="Закрыть"><i data-i="close"></i></button></div><div id="dialogbody"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
